name: Quality gate and container images

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify production source
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Test payment integration runner contract
        run: bash scripts/tests/run-payment-integration.test.sh

      - name: Test PostgreSQL and Redis integration
        run: >-
          bash scripts/tests/run-payment-integration.sh --all
          --require TestPostgresAgentRuntimeUpgradeRejectsLegacyQueuedRunWithExternalFacts

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node for Chromium gate
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Set up Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 151.0.7922.47

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Test web
        working-directory: web
        run: bun test

      - name: Build web
        working-directory: web
        run: bun run build

      - name: Verify payment checkout Nginx sentinels
        env:
          HMAIGC_STATIC_ASSET_BASE_URL: ${{ vars.HMAIGC_STATIC_ASSET_BASE_URL }}
        run: bash scripts/tests/verify-payment-checkout-nginx.test.sh

      - name: Verify membership checkout in production Chromium
        working-directory: web
        env:
          HMAIGC_CHROMIUM_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
          HMAIGC_STATIC_ASSET_BASE_URL: ${{ vars.HMAIGC_STATIC_ASSET_BASE_URL }}
        run: bun run verify:membership-checkout-browser

      - name: Validate production Compose
        run: bash scripts/validate-production-compose.sh

      - name: Build operations controller image
        run: >-
          docker build
          --file backend/Dockerfile.ops
          --build-arg APP_VERSION=v0.0.0-ci
          --build-arg APP_COMMIT=${{ github.sha }}
          --tag hmaigc-ops-controller:ci
          .

      - name: Verify durable operations binaries
        run: |
          docker run --rm --entrypoint hmaigc-ops-runner hmaigc-ops-controller:ci --help
          docker run --rm --entrypoint hmaigc-ops-bootstrap hmaigc-ops-controller:ci --help

      - name: Test durable stage and bootstrap contracts
        run: |
          bash deploy/tests/hmaigc-stage-smoke.sh
          bash deploy/tests/hmaigc-bootstrap-smoke.sh

      - name: Test durable operation fault matrix
        run: bash deploy/tests/ops-runner-fault-injection.sh

      - name: Test install upgrade and rollback orchestration
        run: bash deploy/tests/hmaigc-smoke.sh

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "${GITHUB_REF_NAME}"
          bash scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" >/tmp/release-notes.md

  publish-static-assets:
    name: Publish immutable web assets
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4

      - name: Validate static asset release configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          STATIC_ASSET_BASE_URL: ${{ vars.HMAIGC_STATIC_ASSET_BASE_URL }}
          STATIC_OSS_ENDPOINT: ${{ vars.HMAIGC_STATIC_OSS_ENDPOINT }}
          STATIC_OSS_BUCKET: ${{ vars.HMAIGC_STATIC_OSS_BUCKET }}
          STATIC_OSS_PREFIX: ${{ vars.HMAIGC_STATIC_OSS_PREFIX }}
          STATIC_OSS_ACCESS_KEY_ID: ${{ secrets.HMAIGC_STATIC_OSS_ACCESS_KEY_ID }}
          STATIC_OSS_ACCESS_KEY_SECRET: ${{ secrets.HMAIGC_STATIC_OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          : "${STATIC_ASSET_BASE_URL:?缺少仓库变量 HMAIGC_STATIC_ASSET_BASE_URL}"
          : "${STATIC_OSS_ENDPOINT:?缺少仓库变量 HMAIGC_STATIC_OSS_ENDPOINT}"
          : "${STATIC_OSS_BUCKET:?缺少仓库变量 HMAIGC_STATIC_OSS_BUCKET}"
          : "${STATIC_OSS_PREFIX:?缺少仓库变量 HMAIGC_STATIC_OSS_PREFIX}"
          : "${STATIC_OSS_ACCESS_KEY_ID:?缺少仓库密钥 HMAIGC_STATIC_OSS_ACCESS_KEY_ID}"
          : "${STATIC_OSS_ACCESS_KEY_SECRET:?缺少仓库密钥 HMAIGC_STATIC_OSS_ACCESS_KEY_SECRET}"
          [[ "$STATIC_ASSET_BASE_URL" == https://* ]] || {
            echo "HMAIGC_STATIC_ASSET_BASE_URL 必须使用 HTTPS" >&2
            exit 1
          }
          [[ "$STATIC_ASSET_BASE_URL" != */ ]] || {
            echo "HMAIGC_STATIC_ASSET_BASE_URL 末尾不能包含 /" >&2
            exit 1
          }
          [[ "$STATIC_ASSET_BASE_URL" == "https://static.hm.kunagent.com/hmaigc/web" ]] || {
            echo "HMAIGC_STATIC_ASSET_BASE_URL 必须使用已备案的中国大陆 CDN 域名 https://static.hm.kunagent.com/hmaigc/web，禁止直接 OSS 读取域名" >&2
            exit 1
          }

      - name: Set up Go
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Bun
        if: startsWith(github.ref, 'refs/tags/')
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build versioned web assets
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: web
        env:
          VITE_STATIC_ASSET_BASE_URL: ${{ format('{0}/releases/{1}', vars.HMAIGC_STATIC_ASSET_BASE_URL, github.ref_name) }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Upload and verify every static asset
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: backend
        env:
          HMAIGC_STATIC_OSS_ENDPOINT: ${{ vars.HMAIGC_STATIC_OSS_ENDPOINT }}
          HMAIGC_STATIC_OSS_BUCKET: ${{ vars.HMAIGC_STATIC_OSS_BUCKET }}
          HMAIGC_STATIC_OSS_PREFIX: ${{ vars.HMAIGC_STATIC_OSS_PREFIX }}
          HMAIGC_STATIC_OSS_ACCESS_KEY_ID: ${{ secrets.HMAIGC_STATIC_OSS_ACCESS_KEY_ID }}
          HMAIGC_STATIC_OSS_ACCESS_KEY_SECRET: ${{ secrets.HMAIGC_STATIC_OSS_ACCESS_KEY_SECRET }}
        run: >-
          go run ./cmd/staticpublisher
          --dir ../web/dist
          --release "${GITHUB_REF_NAME}"
          --commit "${GITHUB_SHA}"

      - name: Verify release manifest through CDN
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          STATIC_RELEASE_URL: ${{ format('{0}/releases/{1}/manifest.json', vars.HMAIGC_STATIC_ASSET_BASE_URL, github.ref_name) }}
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 120 \
            "$STATIC_RELEASE_URL" \
            --output /tmp/static-manifest.json
          grep -F "\"release\": \"${GITHUB_REF_NAME}\"" /tmp/static-manifest.json >/dev/null
          grep -F "\"sourceCommit\": \"${GITHUB_SHA}\"" /tmp/static-manifest.json >/dev/null

      - name: Verify entry assets through CDN
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          STATIC_RELEASE_URL: ${{ format('{0}/releases/{1}', vars.HMAIGC_STATIC_ASSET_BASE_URL, github.ref_name) }}
        run: bash scripts/verify-static-release-assets.sh web/dist "$STATIC_RELEASE_URL"

      - name: Preserve verified web release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: hmaigc-web-dist-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs:
      - verify
      - publish-static-assets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hmaigc-web
            dockerfile: Dockerfile
          - image: hmaigc-backend
            dockerfile: backend/Dockerfile
          - image: hmaigc-ops-controller
            dockerfile: backend/Dockerfile.ops

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Download verified web release artifact
        if: matrix.image == 'hmaigc-web' && startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: hmaigc-web-dist-${{ github.sha }}
          path: release-web-dist

      - name: Build and push Go service image
        if: matrix.image == 'hmaigc-backend' || matrix.image == 'hmaigc-ops-controller'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Build and push versioned web image
        if: matrix.image == 'hmaigc-web' && startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web-release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Build and push development web image
        if: matrix.image == 'hmaigc-web' && !startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: Publish GitHub release notes
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract release notes
        shell: bash
        run: bash scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" >release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "HMaigc ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "HMaigc ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
