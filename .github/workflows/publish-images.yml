name: Quality gate and container images

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Verify production source
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        run: go test ./...

      - name: Test payment integration runner contract
        run: bash scripts/tests/run-payment-integration.test.sh

      - name: Test PostgreSQL and Redis integration
        run: >-
          bash scripts/tests/run-payment-integration.sh --all
          --require TestPostgresAgentRuntimeUpgradeRejectsLegacyQueuedRunWithExternalFacts

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node for Chromium gate
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Set up Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 151.0.7922.47

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Test web
        working-directory: web
        run: bun test

      - name: Build web
        working-directory: web
        run: bun run build

      - name: Verify payment checkout Nginx sentinels
        env:
          HMAIGC_STATIC_ASSET_BASE_URL: ${{ vars.HMAIGC_STATIC_ASSET_BASE_URL }}
        run: bash scripts/tests/verify-payment-checkout-nginx.test.sh

      - name: Verify membership checkout in production Chromium
        working-directory: web
        env:
          HMAIGC_CHROMIUM_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
          HMAIGC_STATIC_ASSET_BASE_URL: ${{ vars.HMAIGC_STATIC_ASSET_BASE_URL }}
        run: bun run verify:membership-checkout-browser

      - name: Validate production Compose
        run: bash scripts/validate-production-compose.sh

      - name: Test install upgrade and rollback orchestration
        run: |
          bash deploy/tests/hmaigc-smoke.sh
          bash deploy/tests/hmaigc-release-runner-smoke.sh

      - name: Verify source deployment workflow contract
        run: bash scripts/tests/validate-source-deploy-workflow.test.sh

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "${GITHUB_REF_NAME}"
          bash scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" >/tmp/release-notes.md

  publish-static-assets:
    name: Publish immutable web assets
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4

      - name: Validate static asset release configuration
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          STATIC_ASSET_BASE_URL: ${{ vars.HMAIGC_STATIC_ASSET_BASE_URL }}
          STATIC_OSS_ENDPOINT: ${{ vars.HMAIGC_STATIC_OSS_ENDPOINT }}
          STATIC_OSS_BUCKET: ${{ vars.HMAIGC_STATIC_OSS_BUCKET }}
          STATIC_OSS_PREFIX: ${{ vars.HMAIGC_STATIC_OSS_PREFIX }}
          STATIC_OSS_ACCESS_KEY_ID: ${{ secrets.HMAIGC_STATIC_OSS_ACCESS_KEY_ID }}
          STATIC_OSS_ACCESS_KEY_SECRET: ${{ secrets.HMAIGC_STATIC_OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          : "${STATIC_ASSET_BASE_URL:?缺少仓库变量 HMAIGC_STATIC_ASSET_BASE_URL}"
          : "${STATIC_OSS_ENDPOINT:?缺少仓库变量 HMAIGC_STATIC_OSS_ENDPOINT}"
          : "${STATIC_OSS_BUCKET:?缺少仓库变量 HMAIGC_STATIC_OSS_BUCKET}"
          : "${STATIC_OSS_PREFIX:?缺少仓库变量 HMAIGC_STATIC_OSS_PREFIX}"
          : "${STATIC_OSS_ACCESS_KEY_ID:?缺少仓库密钥 HMAIGC_STATIC_OSS_ACCESS_KEY_ID}"
          : "${STATIC_OSS_ACCESS_KEY_SECRET:?缺少仓库密钥 HMAIGC_STATIC_OSS_ACCESS_KEY_SECRET}"
          [[ "$STATIC_ASSET_BASE_URL" == https://* ]] || {
            echo "HMAIGC_STATIC_ASSET_BASE_URL 必须使用 HTTPS" >&2
            exit 1
          }
          [[ "$STATIC_ASSET_BASE_URL" != */ ]] || {
            echo "HMAIGC_STATIC_ASSET_BASE_URL 末尾不能包含 /" >&2
            exit 1
          }
          [[ "$STATIC_ASSET_BASE_URL" == "https://static.hm.kunagent.com/hmaigc/web" ]] || {
            echo "HMAIGC_STATIC_ASSET_BASE_URL 必须使用已备案的中国大陆 CDN 域名 https://static.hm.kunagent.com/hmaigc/web，禁止直接 OSS 读取域名" >&2
            exit 1
          }

      - name: Set up Go
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up Bun
        if: startsWith(github.ref, 'refs/tags/')
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build versioned web assets
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: web
        env:
          VITE_STATIC_ASSET_BASE_URL: ${{ format('{0}/releases/{1}', vars.HMAIGC_STATIC_ASSET_BASE_URL, github.ref_name) }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Upload and verify every static asset
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: backend
        env:
          HMAIGC_STATIC_OSS_ENDPOINT: ${{ vars.HMAIGC_STATIC_OSS_ENDPOINT }}
          HMAIGC_STATIC_OSS_BUCKET: ${{ vars.HMAIGC_STATIC_OSS_BUCKET }}
          HMAIGC_STATIC_OSS_PREFIX: ${{ vars.HMAIGC_STATIC_OSS_PREFIX }}
          HMAIGC_STATIC_OSS_ACCESS_KEY_ID: ${{ secrets.HMAIGC_STATIC_OSS_ACCESS_KEY_ID }}
          HMAIGC_STATIC_OSS_ACCESS_KEY_SECRET: ${{ secrets.HMAIGC_STATIC_OSS_ACCESS_KEY_SECRET }}
        run: >-
          go run ./cmd/staticpublisher
          --dir ../web/dist
          --release "${GITHUB_REF_NAME}"
          --commit "${GITHUB_SHA}"

      - name: Verify release manifest through CDN
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          STATIC_RELEASE_URL: ${{ format('{0}/releases/{1}/manifest.json', vars.HMAIGC_STATIC_ASSET_BASE_URL, github.ref_name) }}
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 5 \
            --max-time 15 \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 120 \
            "$STATIC_RELEASE_URL" \
            --output /tmp/static-manifest.json
          grep -F "\"release\": \"${GITHUB_REF_NAME}\"" /tmp/static-manifest.json >/dev/null
          grep -F "\"sourceCommit\": \"${GITHUB_SHA}\"" /tmp/static-manifest.json >/dev/null

      - name: Verify entry assets through CDN
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          STATIC_RELEASE_URL: ${{ format('{0}/releases/{1}', vars.HMAIGC_STATIC_ASSET_BASE_URL, github.ref_name) }}
        run: bash scripts/verify-static-release-assets.sh web/dist "$STATIC_RELEASE_URL"

      - name: Preserve verified web release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: hmaigc-web-dist-${{ github.sha }}
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}
    needs:
      - verify
      - publish-static-assets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: hmaigc-web
            dockerfile: Dockerfile
          - image: hmaigc-backend
            dockerfile: backend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Download verified web release artifact
        if: matrix.image == 'hmaigc-web' && startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v4
        with:
          name: hmaigc-web-dist-${{ github.sha }}
          path: release-web-dist

      - name: Build and push Go service image
        if: matrix.image == 'hmaigc-backend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_COMMIT=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Build and push versioned web image
        if: matrix.image == 'hmaigc-web' && startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web-release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Build and push development web image
        if: matrix.image == 'hmaigc-web' && !startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-production:
    name: Deploy tagged source to production
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: hmaigc-production
      cancel-in-progress: false

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Validate production deployment configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.HMAIGC_PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.HMAIGC_PRODUCTION_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.HMAIGC_PRODUCTION_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.HMAIGC_PRODUCTION_SSH_HOST_KEY }}
          DEPLOY_PORT: ${{ vars.HMAIGC_PRODUCTION_PORT }}
          DEPLOY_ROOT: ${{ vars.HMAIGC_PRODUCTION_DEPLOY_ROOT }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "production tag must be a shell-safe semantic version" >&2
            exit 1
          }
          : "${DEPLOY_HOST:?missing HMAIGC_PRODUCTION_HOST secret}"
          : "${DEPLOY_USER:?missing HMAIGC_PRODUCTION_USER secret}"
          : "${DEPLOY_SSH_KEY:?missing HMAIGC_PRODUCTION_SSH_KEY secret}"
          : "${DEPLOY_SSH_HOST_KEY:?missing HMAIGC_PRODUCTION_SSH_HOST_KEY secret}"
          : "${DEPLOY_ROOT:?missing HMAIGC_PRODUCTION_DEPLOY_ROOT variable}"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_HOST" =~ ^[0-9A-Za-z.:-]+$ ]] || { echo "invalid production host" >&2; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][0-9A-Za-z_-]*$ ]] || { echo "invalid production user" >&2; exit 1; }
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && ((DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535)) || {
            echo "invalid production SSH port" >&2
            exit 1
          }
          [[ "$DEPLOY_ROOT" =~ ^/[0-9A-Za-z._/-]+$ ]] \
            && [[ "$DEPLOY_ROOT" != "/" ]] \
            && [[ "$DEPLOY_ROOT" != *".."* ]] \
            && [[ "$DEPLOY_ROOT" != *"//"* ]] || {
            echo "production deploy root must be a dedicated absolute path" >&2
            exit 1
          }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$HOME/.ssh/hmaigc-production"
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/hmaigc-production" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/hmaigc-production" >/dev/null
          ssh-keygen -l -f "$HOME/.ssh/known_hosts" >/dev/null
          printf 'DEPLOY_HOST=%s\nDEPLOY_USER=%s\nDEPLOY_PORT=%s\nDEPLOY_ROOT=%s\n' \
            "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_PORT" "$DEPLOY_ROOT" >>"$GITHUB_ENV"

      - name: Build immutable deployment bundle
        id: production-bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          BUNDLE_ROOT="$RUNNER_TEMP/hmaigc-${GITHUB_REF_NAME}"
          BUNDLE_ARCHIVE="$RUNNER_TEMP/production-release-bundle.tgz"
          install -d -m 755 "$BUNDLE_ROOT/deploy"
          cp docker-compose.production.yml "$BUNDLE_ROOT/docker-compose.production.yml"
          cp deploy/hmaigc.sh "$BUNDLE_ROOT/deploy/hmaigc.sh"
          cp deploy/hmaigc-release-runner.sh "$BUNDLE_ROOT/deploy/hmaigc-release-runner.sh"
          cp -R deploy/lib "$BUNDLE_ROOT/deploy/lib"
          (
            cd "$BUNDLE_ROOT"
            find docker-compose.production.yml deploy -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum >bundle.sha256
          )
          tar -C "$BUNDLE_ROOT" -czf "$BUNDLE_ARCHIVE" .
          test -s "$BUNDLE_ARCHIVE"
          BUNDLE_SHA256="$(sha256sum "$BUNDLE_ARCHIVE" | awk '{print $1}')"
          printf 'archive=%s\nsha256=%s\n' \
            "$BUNDLE_ARCHIVE" "$BUNDLE_SHA256" >>"$GITHUB_OUTPUT"

      - name: Transfer and execute tagged deployment
        shell: bash
        env:
          BUNDLE_ARCHIVE: ${{ steps.production-bundle.outputs.archive }}
          BUNDLE_SHA256: ${{ steps.production-bundle.outputs.sha256 }}
        run: |
          set -Eeuo pipefail
          : "${BUNDLE_ARCHIVE:?deployment bundle output is missing}"
          : "${BUNDLE_SHA256:?deployment bundle checksum output is missing}"
          test -s "$BUNDLE_ARCHIVE"
          printf '%s  %s\n' "$BUNDLE_SHA256" "$BUNDLE_ARCHIVE" | sha256sum -c -
          SSH_TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          SSH_OPTIONS=(
            -i "$HOME/.ssh/hmaigc-production"
            -p "$DEPLOY_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
          )
          RELEASE_DIR="$DEPLOY_ROOT/releases/$GITHUB_REF_NAME"
          STAGING_DIR="$DEPLOY_ROOT/staging/$GITHUB_REF_NAME-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          ssh "${SSH_OPTIONS[@]}" "$SSH_TARGET" \
            "install -d -m 755 '$DEPLOY_ROOT/releases' '$DEPLOY_ROOT/staging' '$DEPLOY_ROOT/shared' '$STAGING_DIR'"
          tar -xOf "$BUNDLE_ARCHIVE" ./bundle.sha256 >/dev/null
          cat "$BUNDLE_ARCHIVE" \
            | ssh "${SSH_OPTIONS[@]}" "$SSH_TARGET" "tar -xzf - -C '$STAGING_DIR'"
          ssh "${SSH_OPTIONS[@]}" "$SSH_TARGET" "bash -se" <<REMOTE_VERIFY
          set -Eeuo pipefail
          cd '$STAGING_DIR'
          sha256sum -c bundle.sha256
          if [[ -e '$RELEASE_DIR' ]]; then
            cmp -s bundle.sha256 '$RELEASE_DIR/bundle.sha256' || {
              echo 'existing release bundle does not match this tag' >&2
              exit 1
            }
            rm -rf -- '$STAGING_DIR'
          else
            mv -- '$STAGING_DIR' '$RELEASE_DIR'
          fi
          REMOTE_VERIFY
          ssh "${SSH_OPTIONS[@]}" "$SSH_TARGET" \
            "bash '$RELEASE_DIR/deploy/hmaigc-release-runner.sh' '$GITHUB_REF_NAME' '$DEPLOY_ROOT'"

  release:
    name: Publish GitHub release notes
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract release notes
        shell: bash
        run: bash scripts/extract-release-notes.sh "${GITHUB_REF_NAME}" >release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "HMaigc ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "HMaigc ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
