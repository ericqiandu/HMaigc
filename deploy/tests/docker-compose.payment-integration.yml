services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hmaigc_payment_integration
      POSTGRES_USER: hmaigc
      POSTGRES_PASSWORD: integration-only-password
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmaigc -d hmaigc_payment_integration"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
