name: ${HMAIGC_COMPOSE_PROJECT_NAME:-hmaigc}

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hmaigc}
      POSTGRES_USER: ${POSTGRES_USER:-hmaigc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须配置 PostgreSQL 密码}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ${HMAIGC_IMAGE_REGISTRY:?必须配置镜像仓库}/hmaigc-backend:${HMAIGC_VERSION:?必须配置发布版本}
    pull_policy: missing
    environment:
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_CHANGELOG_PATH: /app/CHANGELOG.md
      CANVAS_DATABASE_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-hmaigc}:${POSTGRES_PASSWORD:?必须配置 PostgreSQL 密码}@postgres:5432/${POSTGRES_DB:-hmaigc}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_ENVIRONMENT: ${CANVAS_ENVIRONMENT:?必须明确配置 production}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:?必须配置生产站点 Origin}
      HMAIGC_OPS_SOCKET: /run/hmaigc-ops/controller.sock
      HMAIGC_OPS_SHARED_SECRET_FILE: /run/hmaigc-ops/shared-secret
      GIN_MODE: release
    volumes:
      - backend-data:/data
      - ops-state:/run/hmaigc-ops:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${HMAIGC_IMAGE_REGISTRY:?必须配置镜像仓库}/hmaigc-web:${HMAIGC_VERSION:?必须配置发布版本}
    pull_policy: missing
    ports:
      - "${CANVAS_HTTP_HOST:-127.0.0.1}:${CANVAS_HTTP_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
    name: ${HMAIGC_BACKEND_DATA_VOLUME:-hmaigc-backend-data}
  postgres-data:
    name: ${HMAIGC_POSTGRES_DATA_VOLUME:-hmaigc-postgres-data}
  redis-data:
    name: ${HMAIGC_REDIS_DATA_VOLUME:-hmaigc-redis-data}
  ops-state:
    external: true
    name: ${HMAIGC_OPS_STATE_VOLUME:-hmaigc-ops-state}
