name: hmaigc-local

services:
  backend:
    image: hmaigc-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APK_REPOSITORY: ${APK_REPOSITORY:-https://mirrors.tuna.tsinghua.edu.cn/alpine}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    environment:
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_CHANGELOG_PATH: /app/CHANGELOG.md
      CANVAS_DATABASE_DRIVER: ${CANVAS_DATABASE_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_DEVELOPMENT_PROXY_URL: ${CANVAS_DEVELOPMENT_PROXY_URL:-http://host.docker.internal:7897}
      CANVAS_ENVIRONMENT: ${CANVAS_ENVIRONMENT:-development}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CANVAS_IMAGE_PROMPT_SPECIALIST_ENABLED: ${CANVAS_IMAGE_PROMPT_SPECIALIST_ENABLED:-false}
      CANVAS_IMAGE_PROMPT_SPECIALIST_URL: ${CANVAS_IMAGE_PROMPT_SPECIALIST_URL:-}
      CANVAS_IMAGE_PROMPT_HMAC_SERVICE_ID: ${CANVAS_IMAGE_PROMPT_HMAC_SERVICE_ID:-}
      CANVAS_IMAGE_PROMPT_HMAC_SECRET: ${CANVAS_IMAGE_PROMPT_HMAC_SECRET:-}
      CANVAS_IMAGE_PROMPT_TIMEOUT_MS: ${CANVAS_IMAGE_PROMPT_TIMEOUT_MS:-}
      CANVAS_IMAGE_PROMPT_RELAY_ALLOWED_SERVICE_ID: ${CANVAS_IMAGE_PROMPT_RELAY_ALLOWED_SERVICE_ID:-}
      CANVAS_IMAGE_PROMPT_RELAY_HMAC_SECRET: ${CANVAS_IMAGE_PROMPT_RELAY_HMAC_SECRET:-}
      GIN_MODE: release
    ports:
      - "127.0.0.1:${CANVAS_BACKEND_HOST_PORT:-8180}:8080"
    volumes:
      - ${CANVAS_DATA_PATH:?必须通过 scripts/local-compose.ps1 显式绑定主项目数据目录}:/data
    restart: unless-stopped

  web:
    image: hmaigc-web:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
