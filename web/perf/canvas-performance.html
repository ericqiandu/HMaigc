<!doctype html>
<html lang="zh-CN" class="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HMaigc 画布性能基准</title>
        <style>
            html,
            body,
            #canvas-performance-root {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #0b0c0f;
            }
            .canvas-performance-page {
                position: relative;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            .canvas-performance-status {
                position: fixed;
                z-index: 100;
                top: 16px;
                left: 16px;
                padding: 8px 12px;
                border-radius: 8px;
                background: rgba(20, 21, 24, 0.9);
                color: #f5f5f5;
                font:
                    12px/1.4 ui-monospace,
                    SFMono-Regular,
                    Consolas,
                    monospace;
            }
            .canvas-performance-world {
                position: absolute;
                top: 80px;
                left: 40px;
                width: 24000px;
                height: 16000px;
                transform: scale(0.18);
                transform-origin: top left;
                contain: layout style paint;
            }
        </style>
        <script>
            window.__CANVAS_BENCHMARK_STARTED_AT__ = performance.now();
        </script>
    </head>
    <body>
        <div id="canvas-performance-root"></div>
        <script type="module" src="/perf/canvas-performance-fixture.tsx"></script>
    </body>
</html>
