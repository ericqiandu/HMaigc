map $http_x_forwarded_proto $canvas_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_upgrade $canvas_connection_upgrade {
    default upgrade;
    "" close;
}

map $status $canvas_proxy_failure {
    ~^[45] 1;
    default 0;
}

# 收银台属于 bearer capability 表面。策略只维护一份；会覆盖 add_header
# 继承的支付 location 必须再次显式发送，防止成功或错误响应漏掉安全头。
map "" $canvas_content_security_policy {
    default "default-src 'self'; base-uri 'self'; connect-src 'self' https: wss: blob: data:; font-src 'self' data: https://static.hm.kunagent.com; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; object-src 'none'; script-src 'self' 'sha256-I6LPtG0ZaWWZjaqo01/h/CYOOBc9+Ljxd5XeZLu6aEI=' 'sha256-zf//CZlNtBsdfnnVuMsQm4ACjMfCcJk7E/v9zZbYc+A=' 'wasm-unsafe-eval' https://static.hm.kunagent.com; style-src 'self' 'unsafe-inline' https://static.hm.kunagent.com; worker-src 'self' blob: https://static.hm.kunagent.com";
}

log_format canvas_no_query '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                           '"$http_user_agent"';
log_format canvas_proxy_error 'proxy_failure time=$time_iso8601 client=$remote_addr '
                              'method=$request_method uri=$uri status=$status '
                              'upstream_status=$upstream_status';

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # 业务配置最高允许 999MB；网关保留少量 multipart 开销，避免保存出无法生效的上限。
    client_max_body_size 1024m;
    access_log /var/log/nginx/access.log canvas_no_query;
    add_header Content-Security-Policy $canvas_content_security_policy always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location ^~ /api/public/canvas-shares/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Referer "";
        proxy_read_timeout 3600s;
    }

    # Checkout URLs are bearer capabilities. Their raw URI and Referer must never reach proxy logs.
    location ^~ /api/payments/checkout/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Referer "";
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Referrer-Policy;
        proxy_read_timeout 3600s;
        add_header Cache-Control "private, no-store" always;
        add_header Content-Security-Policy $canvas_content_security_policy always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location /api/ {
        access_log /var/log/nginx/access.log canvas_no_query;
        access_log /var/log/nginx/error.log canvas_proxy_error if=$canvas_proxy_failure;
        error_log /dev/null crit;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Referer "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $canvas_connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location = /oauth/linuxdo/callback {
        access_log /var/log/nginx/access.log canvas_no_query;
        access_log /var/log/nginx/error.log canvas_proxy_error if=$canvas_proxy_failure;
        error_log /dev/null crit;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $canvas_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Referer "";
        proxy_read_timeout 30s;
    }

    location = /assets {
        rewrite ^ /index.html last;
    }

    location = /assets/ {
        rewrite ^ /index.html last;
    }

    # SPA 入口必须在每次页面导航时重新验证，避免部署后继续加载旧的资源清单。
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # Vite 产物文件名包含内容哈希，可长期缓存；新版本会自然切换到新的 URL。
    location ^~ /assets/ {
        access_log off;
        expires 1y;
        try_files $uri =404;
    }

    location ^~ /share/canvas/ {
        access_log off;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /pay/ {
        access_log off;
        error_log /dev/null crit;
        try_files /index.html =404;
        add_header Cache-Control "private, no-store" always;
        add_header Content-Security-Policy $canvas_content_security_policy always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
